<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition.js — mode fondu</title>
  <link rel="stylesheet" href="../transition.css">
  <link rel="stylesheet" href="../themes/base.css">
  <style>
    body { font-family: system-ui, sans-serif; color: white; }
    #slides > section { background: #234; }
    #slides > section:nth-child(2) { background: #345; }
    #slides > section:nth-child(3) { background: #456; }
    #slides > section:nth-child(4) { background: #567; }
  </style>
</head>
<body>
  <!-- class="fade": slides are stacked; `active` reveals one on top of the previous ones -->
  <div id="slides" class="fade">
    <section><div><h1>Mode fondu</h1><p class="small">Les diapos sont empilées</p></div></section>
    <section><div><p>Chaque diapo apparaît par-dessus la précédente…</p></div></section>
    <section><div><p>…en basculant simplement sa classe <code>active</code>.</p>
      <p class="hidden" data-fragments="{hidden} 0.5s">Les fragments internes fonctionnent comme d'habitude.</p></div></section>
    <section><div><p>Un pas en arrière la retire, et la précédente réapparaît.</p></div></section>
  </div>

  <div id="navigate"><span id="arrowUp">▲</span> <span id="arrowDown">▼</span></div>

  <script src="../transition.js"></script>
  <script>
    TransitionJS.init();   // with class "fade" on #slides, the default rule is '{active} 0.6s'
  </script>
</body>
</html>
